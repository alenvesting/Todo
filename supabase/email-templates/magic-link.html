<!-- Klistra in i Supabase: Authentication -> Email Templates -> Magic Link (och gärna även "Confirm signup") -->
<!-- Ämne: Din inloggning till Bocka -->
<div style="font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:420px;margin:0 auto;padding:24px;color:#1d2330">
  <h2 style="margin:0 0 12px">Logga in i Bocka</h2>
  <p>Klicka på knappen för att logga in:</p>
  <p style="margin:24px 0">
    <a href="{{ .ConfirmationURL }}" style="background:#2f6fde;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:600">Logga in</a>
  </p>
  <p>…eller skriv in den här koden i appen:</p>
  <p style="font-size:28px;font-weight:700;letter-spacing:6px;margin:8px 0 24px">{{ .Token }}</p>
  <p style="color:#6b7484;font-size:13px">Har du inte bett om detta kan du ignorera mejlet.</p>
</div>
